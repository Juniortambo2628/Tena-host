name: Test & Auto-Fix Suite

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test-and-lint:
    name: Lint, Auto-Fix & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tena_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, mysql, zip, bcmath, ctype, fileinfo, json, tokenizer, pcntl, dom, curl, openssl
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate Composer JSON
        run: composer validate --no-check-publish

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Assets
        run: npm run build

      - name: Setup Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tena_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Run Laravel Pint (Auto-Fix Code Style)
        run: vendor/bin/pint

      - name: Check for Pint Changes
        id: pint-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit Pint Auto-Fixes
        if: steps.pint-changes.outputs.has_changes == 'true' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix PHP code style with Laravel Pint"
          branch: ${{ github.ref_name }}
          file_pattern: 'app/ config/ database/ routes/ resources/'

      - name: Run Pest Test Suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tena_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

      - name: Verify Artisan Functions
        run: |
          php artisan route:list --compact
          php artisan config:cache
          php artisan config:clear
          php artisan about

      - name: Verify Required Files Exist
        run: |
          echo "=== Checking critical files ==="
          for file in \
            "app/Http/Kernel.php" \
            "config/app.php" \
            "config/database.php" \
            "config/services.php" \
            "database/migrations" \
            "routes/web.php" \
            "routes/api.php" \
            "public/index.php" \
            "artisan" \
            "composer.json" \
            "composer.lock" \
            "package.json"; do
            if [ ! -e "$file" ]; then
              echo "MISSING: $file"
              exit 1
            fi
            echo "OK: $file"
          done
          echo "=== All critical files present ==="

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            vendor/
            public/build/
            node_modules/.package-lock.json
          retention-days: 1
