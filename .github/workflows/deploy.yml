name: Deploy to Production

on:
  workflow_run:
    workflows: ["Test & Auto-Fix Suite"]
    types: [completed]
    branches: [master, main]

  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to cPanel Production Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    env:
      MIN_PHP_VERSION: "8.2"
      REQUIRED_EXTENSIONS: mbstring intl pdo_mysql mysqli zip bcmath ctype fileinfo json tokenizer pcntl dom curl openssl

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, mysql, zip, bcmath, ctype, fileinfo, json, tokenizer, pcntl, dom, curl, openssl
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate Composer JSON
        run: composer validate --no-check-publish

      - name: Install Composer Dependencies (Production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM Dependencies & Build Production Assets
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Verify Build Artifacts
        run: |
          echo "=== Verifying build output ==="
          for dir in vendor public/build; do
            if [ ! -d "$dir" ]; then
              echo "MISSING DIRECTORY: $dir"
              exit 1
            fi
            echo "OK: $dir"
          done
          echo "=== Build artifacts verified ==="

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts || true

      - name: Pre-Flight Server Checks
        run: |
          set -e
          echo "========================================="
          echo "  PRE-FLIGHT CHECKS"
          echo "========================================="

          echo "===> Checking server connectivity"
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo '     Connection OK'"

          echo "===> Checking PHP version (requires >= ${{ env.MIN_PHP_VERSION }})"
          CURRENT_PHP=$(ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "php -r 'echo PHP_MAJOR_VERSION.\".\".PHP_MINOR_VERSION;'" 2>/dev/null)
          echo "     Current PHP: $CURRENT_PHP"

          if [ "$(printf '%s\n' "${{ env.MIN_PHP_VERSION }}" "$CURRENT_PHP" | sort -V | head -n1)" != "${{ env.MIN_PHP_VERSION }}" ]; then
            echo "ERROR: PHP $CURRENT_PHP is below minimum required ${{ env.MIN_PHP_VERSION }}"
            exit 1
          fi
          echo "     PHP version OK"

          echo "===> Checking required PHP extensions"
          MISSING_EXTS=$(ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "php -m" 2>/dev/null | while read ext; do
            for required in ${{ env.REQUIRED_EXTENSIONS }}; do
              if [ "$ext" = "$required" ]; then
                echo "$ext"
                break
              fi
            done
          done | sort)

          ALL_FOUND=true
          for ext in ${{ env.REQUIRED_EXTENSIONS }}; do
            if ! echo "$MISSING_EXTS" | grep -q "^${ext}$"; then
              echo "     MISSING: $ext"
              ALL_FOUND=false
            fi
          done

          if [ "$ALL_FOUND" = false ]; then
            echo "ERROR: Required extensions missing"
            exit 1
          fi
          echo "     All required extensions present"

          echo "===> Checking disk space"
          DISK_AVAIL=$(ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "df -BM ~ | tail -1 | awk '{print \$4}' | tr -d 'M'" 2>/dev/null)
          echo "     Available disk: ${DISK_AVAIL}MB"
          if [ "$DISK_AVAIL" -lt 500 ]; then
            echo "WARNING: Low disk space (<500MB available)"
          fi

          echo "========================================="
          echo "  Pre-flight checks passed"
          echo "========================================="

      - name: Clean Old Build Assets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== Cleaning old frontend build assets ==="
            rm -rf ~/tena.host/build/* 2>/dev/null || true
            rm -rf ~/tena-core/public/build/* 2>/dev/null || true
            echo "     Old build assets cleared (tena.host + tena-core/public)"
            echo "=== Preserving user uploads ==="
            mkdir -p ~/tena-core/storage/app/public 2>/dev/null || true
            echo "     User uploads directory preserved"

      - name: Upload & Extract Backend Code
        run: |
          set -e
          echo "=== Creating backend code archive ==="
          tar czf /tmp/backend-code.tar.gz \
            app/ config/ database/ routes/ resources/ bootstrap/ vendor/ \
            artisan composer.json composer.lock
          echo "Archive size: $(du -h /tmp/backend-code.tar.gz | cut -f1)"

          echo "=== Uploading archive to server ==="
          scp -P ${{ secrets.SSH_PORT }} /tmp/backend-code.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/backend-code.tar.gz

          echo "=== Extracting to ~/tena-core/ ==="
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ~/tena-core && \
            tar xzf ~/backend-code.tar.gz && \
            echo 'Extraction complete' && \
            echo 'Routes files:' && ls -la routes/ && \
            echo 'App dir exists:' && test -d app && echo 'yes' || echo 'no' && \
            echo 'Config dir exists:' && test -d config && echo 'yes' || echo 'no'
          "

          echo "=== Verifying critical files ==="
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            CORE=~/tena-core
            MISSING=0

            for f in artisan composer.json routes/web.php routes/api.php routes/console.php app/Models/User.php config/app.php; do
              if [ -e \"\$CORE/\$f\" ]; then
                echo \"  OK: \$f\"
              else
                echo \"  MISSING: \$f\"
                MISSING=1
              fi
            done

            if [ \"\$MISSING\" -eq 1 ]; then
              echo 'ERROR: Critical files missing after extraction'
              exit 1
            fi
            echo 'All critical files verified'
          "

          echo "=== Cleaning up ==="
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "rm -f ~/backend-code.tar.gz"
          rm -f /tmp/backend-code.tar.gz

      - name: Upload & Extract Frontend Build Assets
        run: |
          set -e
          echo "=== Creating frontend build archive ==="
          tar czf /tmp/frontend-build.tar.gz -C public build/
          echo "Archive size: $(du -h /tmp/frontend-build.tar.gz | cut -f1)"

          echo "=== Uploading archive to server ==="
          scp -P ${{ secrets.SSH_PORT }} /tmp/frontend-build.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/frontend-build.tar.gz

          echo "=== Extracting to ~/tena.host/build (webroot, served by Apache) ==="
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ~/tena.host && tar xzf ~/frontend-build.tar.gz && echo 'Manifest:' && ls -la build/manifest.json && echo 'Assets count:' && ls build/assets/ | wc -l"

          echo "=== Verifying build integrity ==="
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            if [ ! -f ~/tena.host/build/manifest.json ]; then
              echo 'ERROR: manifest.json not found after extraction'
              exit 1
            fi
            if [ ! -d ~/tena.host/build/assets ]; then
              echo 'ERROR: assets directory not found after extraction'
              exit 1
            fi
            echo 'Build extraction verified'
          "

          echo "=== Cleaning up ==="
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "rm -f ~/frontend-build.tar.gz"
          rm -f /tmp/frontend-build.tar.gz

      - name: Sync .htaccess to Public Root
        run: |
          cat public/.htaccess | ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cat > ~/tena.host/.htaccess"
          echo ".htaccess synced to ~/tena.host/"

      - name: Sync .env Template
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env.production"
          target: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/tena-core/.env.production
          strip_components: 0
          rm: false

      - name: Server-Side Deployment & Verification
        run: |
          set -e
          SSH_CMD="ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          echo "========================================="
          echo "  SERVER DEPLOYMENT"
          echo "  $(date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================="

          $SSH_CMD << 'DEPLOY_SCRIPT'
          set -e
          CORE="$HOME/tena-core"
          PUBLIC="$HOME/tena.host"

          # ── 1. Create Required Directories ──
          echo ""
          echo "===> [1/12] Creating required directories"
          mkdir -p "$CORE/storage/framework/cache/data"
          mkdir -p "$CORE/storage/framework/sessions"
          mkdir -p "$CORE/storage/framework/views"
          mkdir -p "$CORE/storage/logs"
          mkdir -p "$CORE/storage/app/public"
          mkdir -p "$CORE/bootstrap/cache"
          mkdir -p "$PUBLIC/api"
          mkdir -p "$PUBLIC/build"
          mkdir -p "$PUBLIC/uploads"
          echo "     Directories created"

          # ── 2. Create/Verify Symlinks ──
          echo ""
          echo "===> [2/12] Creating/verifying symlinks"

          # index.php entrypoints (only if changed)
          if [ ! -f "$PUBLIC/index.php" ]; then
            cp "$CORE/public/index.php" "$PUBLIC/index.php"
            echo "     Created: $PUBLIC/index.php"
          fi
          if [ ! -f "$PUBLIC/api/index.php" ]; then
            cp "$CORE/public/index.php" "$PUBLIC/api/index.php"
            echo "     Created: $PUBLIC/api/index.php"
          fi

          # Public storage symlinks
          ln -sfn "$CORE/storage/app/public" "$PUBLIC/storage"
          ln -sfn "$CORE/storage/app/public" "$CORE/public/storage"

          # Build assets symlink - remove any existing directory/symlink first, then create fresh
          rm -rf "$CORE/public/build" 2>/dev/null || true
          ln -sfn "$PUBLIC/build" "$CORE/public/build"

          # Verify the symlink works
          if [ ! -f "$CORE/public/build/manifest.json" ]; then
            echo "     ERROR: manifest.json not accessible via build symlink"
            exit 1
          fi
          echo "     Storage and build symlinks verified"

          # ── 3. Configure .env ──
          echo ""
          echo "===> [3/12] Configuring production .env"
          cd "$CORE"

          # Only create .env if it doesn't exist
          if [ ! -f "$CORE/.env" ]; then
            if [ -f "$CORE/.env.production" ]; then
              cp "$CORE/.env.production" "$CORE/.env"
              echo "     .env created from production template"
            else
              echo "     ERROR: .env.production template not found"
              exit 1
            fi
          else
            echo "     .env exists - preserving current configuration"
          fi

          # Generate APP_KEY if empty
          if grep -q "^APP_KEY=$" "$CORE/.env"; then
            php artisan key:generate --force
            echo "     APP_KEY generated"
          fi

          # Validate critical keys exist
          echo "     Validating .env keys..."
          for key in APP_NAME APP_ENV APP_KEY APP_DEBUG APP_URL DB_CONNECTION DB_HOST DB_DATABASE DB_USERNAME DB_PASSWORD; do
            if grep -q "^${key}=" "$CORE/.env" && ! grep -q "^${key}=$" "$CORE/.env"; then
              echo "     OK: $key"
            else
              echo "     WARNING: $key is empty or missing"
            fi
          done

          # ── 4. Verify Server-Side Dependencies ──
          echo ""
          echo "===> [4/12] Verifying composer dependencies"
          cd "$CORE"
          if [ -f "composer.lock" ]; then
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts 2>&1 || {
              echo "     WARNING: composer install issues (non-fatal)"
            }
          fi
          echo "     Vendor directory verified"

          # ── 5. Clear All Caches ──
          echo ""
          echo "===> [5/12] Clearing all caches"
          cd "$CORE"
          php artisan config:clear 2>&1 || true
          php artisan route:clear 2>&1 || true
          php artisan view:clear 2>&1 || true
          php artisan event:clear 2>&1 || true
          php artisan cache:clear 2>&1 || true
          php artisan clear-compiled 2>&1 || true
          echo "     All caches cleared"

          # ── 6. Run Database Migrations ──
          echo ""
          echo "===> [6/12] Running database migrations"
          cd "$CORE"
          php artisan migrate --force 2>&1 || {
            echo "     WARNING: Migration issues (non-fatal)"
          }
          echo "     Migrations complete"

          # ── 7. Seed Database (DISABLED - seeders are dev/staging only) ──
          echo ""
          echo "===> [7/12] Skipping database seeders (production-safe)"
          echo "     Seeders should only be run manually via 'php artisan db:seed' in dev/staging"
          echo "     To seed production data, run manually after deploy with care"

          # ── 8. Rebuild Caches ──
          echo ""
          echo "===> [8/12] Rebuilding caches"
          cd "$CORE"
          php artisan config:cache 2>&1 || echo "     WARNING: config:cache failed"
          php artisan route:cache 2>&1 || {
            echo "     WARNING: route:cache failed - clearing route cache"
            php artisan route:clear 2>&1 || true
          }
          php artisan view:cache 2>&1 || true
          php artisan event:cache 2>&1 || true
          echo "     Caches rebuilt"

          # ── 8b. Verify Routes ──
          echo ""
          echo "===> [8b] Verifying critical routes"
          cd "$CORE"

          # Check that routes/web.php contains the waitlist route
          if grep -q "waitlist" "$CORE/routes/web.php" 2>/dev/null; then
            echo "     OK: waitlist route defined in routes/web.php"
          else
            echo "     ERROR: waitlist route NOT found in routes/web.php"
          fi

          # Verify route is loadable (uses pipe to avoid --columns which may not exist)
          if php artisan route:list 2>/dev/null | grep -q "waitlist"; then
            echo "     OK: /waitlist route found in route list"
          else
            echo "     WARNING: /waitlist route not found in route list - rebuilding..."
            php artisan route:clear 2>&1 || true
            php artisan route:cache 2>&1 || true
            if php artisan route:list 2>/dev/null | grep -q "waitlist"; then
              echo "     OK: /waitlist route found after rebuild"
            else
              echo "     ERROR: /waitlist route still missing after rebuild"
              echo "     Falling back to no route cache (uncached routes)"
              php artisan route:clear 2>&1 || true
            fi
          fi

          # Verify the POST method exists for /waitlist
          if php artisan route:list --methods 2>/dev/null | grep -q "POST.*waitlist"; then
            echo "     OK: POST /waitlist method confirmed"
          else
            echo "     INFO: Could not verify POST method (route:list --methods may not be supported)"
          fi

          # ── 9. Set Permissions ──
          echo ""
          echo "===> [9/12] Setting permissions"
          # Core application
          find "$CORE" -type f -exec chmod 644 {} \; 2>/dev/null || true
          find "$CORE" -type d -exec chmod 755 {} \; 2>/dev/null || true
          # Storage needs write access
          chmod -R 775 "$CORE/storage"
          # Bootstrap cache needs write access
          chmod -R 775 "$CORE/bootstrap/cache"
          # Public directory
          find "$PUBLIC" -type f -exec chmod 644 {} \; 2>/dev/null || true
          find "$PUBLIC" -type d -exec chmod 755 {} \; 2>/dev/null || true
          # Protect .env
          chmod 600 "$CORE/.env" 2>/dev/null || true
          # Protect .git
          chmod -R 700 "$CORE/.git" 2>/dev/null || true
          echo "     Permissions set"

          # ── 10. Cleanup Old Files ──
          echo ""
          echo "===> [10/12] Cleaning up old files"
          # Remove old log files (older than 30 days)
          DELETED_LOGS=$(find "$CORE/storage/logs" -name "*.log" -mtime +30 -delete -print 2>/dev/null | wc -l)
          echo "     Removed $DELETED_LOGS old log files"
          # Remove old session files (older than 7 days)
          DELETED_SESSIONS=$(find "$CORE/storage/framework/sessions" -type f -mtime +7 -delete -print 2>/dev/null | wc -l)
          echo "     Removed $DELETED_SESSIONS old session files"
          # Remove old cache files (older than 7 days)
          DELETED_CACHE=$(find "$CORE/storage/framework/cache/data" -type f -mtime +7 -delete -print 2>/dev/null | wc -l)
          echo "     Removed $DELETED_CACHE old cache files"
          # Remove old compiled views (older than 7 days)
          DELETED_VIEWS=$(find "$CORE/storage/framework/views" -name "*.php" -mtime +7 -delete -print 2>/dev/null | wc -l)
          echo "     Removed $DELETED_VIEWS old compiled views"

          # ── 11. Restart Queue Workers ──
          echo ""
          echo "===> [11/12] Restarting queue workers"
          cd "$CORE"
          php artisan queue:restart 2>&1 || echo "     INFO: No queue workers running"

          # ── 12. Final Verification ──
          echo ""
          echo "===> [12/12] Running verification checks"
          cd "$CORE"

          # Artisan check
          php artisan about > /dev/null 2>&1 && echo "     OK: Artisan responsive" || echo "     WARNING: Artisan not responsive"

          # Route cache check
          if ls "$CORE"/bootstrap/cache/routes*.php 1> /dev/null 2>&1; then
            echo "     OK: Route cache exists"
          else
            echo "     WARNING: Route cache not found"
          fi

          # Config cache check
          if [ -f "$CORE/bootstrap/cache/config.php" ]; then
            echo "     OK: Config cache exists"
          else
            echo "     WARNING: Config cache not found"
          fi

          # View count
          VIEW_COUNT=$(find "$CORE/storage/framework/views" -name "*.php" 2>/dev/null | wc -l)
          echo "     OK: $VIEW_COUNT compiled views"

          # Vendor count
          VENDOR_COUNT=$(find "$CORE/vendor" -maxdepth 1 -type d 2>/dev/null | wc -l)
          echo "     OK: $VENDOR_COUNT top-level vendor packages"

          # Build assets
          if [ -d "$PUBLIC/build" ]; then
            ASSET_COUNT=$(find "$PUBLIC/build" -type f 2>/dev/null | wc -l)
            echo "     OK: $ASSET_COUNT frontend build assets"
          else
            echo "     WARNING: Frontend build directory not found"
          fi

          # Vite manifest check (critical for @vite directive)
          if [ -f "$PUBLIC/build/manifest.json" ]; then
            echo "     OK: Vite manifest.json present"
          else
            echo "     ERROR: Vite manifest.json MISSING"
            exit 1
          fi

          # Vite manifest accessible via symlink
          if [ -f "$CORE/public/build/manifest.json" ]; then
            echo "     OK: Vite manifest accessible via symlink"
          else
            echo "     ERROR: Vite manifest NOT accessible via symlink"
            exit 1
          fi

          # Index.php check
          for entry in "$PUBLIC/index.php" "$PUBLIC/api/index.php"; do
            if [ -f "$entry" ]; then
              echo "     OK: $entry"
            else
              echo "     WARNING: $entry missing"
            fi
          done

          # Symlink check
          if [ -L "$PUBLIC/storage" ]; then
            echo "     OK: Public storage symlink active"
          else
            echo "     WARNING: Public storage symlink missing"
          fi

          # User uploads preserved check
          if [ -d "$PUBLIC/uploads" ]; then
            UPLOAD_COUNT=$(find "$PUBLIC/uploads" -type f 2>/dev/null | wc -l)
            echo "     OK: $UPLOAD_COUNT user uploads preserved"
          fi

          echo ""
          echo "========================================="
          echo "  DEPLOYMENT COMPLETE"
          echo "  $(date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================="
          echo ""
          echo "  PHP:            $(php -r 'echo PHP_VERSION;')"
          echo "  Core Path:      $CORE"
          echo "  Public Path:    $PUBLIC"
          echo "  Vendor:         $VENDOR_COUNT packages"
          echo "  Build Assets:   $ASSET_COUNT files"
          echo "  Compiled Views: $VIEW_COUNT"
          echo "  User Uploads:   $UPLOAD_COUNT files"
          echo ""

      - name: Post-Deploy Health Check
        run: |
          set -e
          SSH_CMD="ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          echo "===> Running health check"

          # Test HTTP response
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://tena.host" 2>/dev/null || echo "000")
          echo "     HTTPS Response: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "     HEALTH CHECK PASSED"
          else
            echo "     WARNING: Health check returned HTTP $HTTP_STATUS"
            echo "     Attempting to diagnose..."
            curl -s -I "https://tena.host" 2>/dev/null | head -10 || true

            # Check if PHP-FPM is running
            $SSH_CMD "ps aux | grep -i php-fpm | grep -v grep" 2>/dev/null || echo "     PHP-FPM may not be running"
          fi
