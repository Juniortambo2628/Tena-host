# Deploys TenaFi to the Hestia VPS (tena-fi.com) with the OKJT deploy kit,
# after CI ("Test & Auto-Fix Suite") passes on master. Laravel + Vite/React/
# Inertia in the repo root: the kit runs composer + npm on the runner, rsyncs
# a release into private/tenafi/releases/, migrates, switches the symlink and
# verifies. Queue worker and scheduler run under PM2.
#
# Runs only once the repository variable DEPLOY_ENABLED is "true" (set after
# the VPS site, DB and secrets exist), or by hand via workflow_dispatch.
name: Deploy

on:
  workflow_run:
    workflows: ["Test & Auto-Fix Suite"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success')
    uses: Juniortambo2628/OKJT/.github/workflows/deploy-laravel.yml@main
    with:
      domain: tena-fi.com
      app_name: tenafi
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      npm_flags: --legacy-peer-deps
      queue: true
      scheduler: true
      health_path: /up
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      ENV_FILE: ${{ secrets.PROD_ENV }}
